[package]
name = "slicer-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forwarded directly to slicer-ffi so RPC integration tests can exercise the
# real STEP import path with a single `--features with-libslic3r`.
#
# It is no longer only a test switch: it also compiles in the B-rep branch
# of `geometry.build`, so a binary that links OCCT but does not enable it
# here builds meshes and says it has no OCCT. Anything that depends on
# this crate and enables the feature elsewhere must enable it here too —
# see the guard test in `slicer-daemon`.
with-libslic3r = ["slicer-ffi/with-libslic3r"]

[dependencies]
slicer-types = { path = "../slicer-types" }
slicer-state = { path = "../slicer-state" }
slicer-pipeline = { path = "../slicer-pipeline" }
slicer-ffi = { path = "../slicer-ffi" }
slicer-geometry = { path = "../slicer-geometry" }
slicer-machine = { path = "../slicer-machine" }
slicer-gcode = { path = "../slicer-gcode" }
slicer-verify = { path = "../slicer-verify" }
tokio = { workspace = true }
axum = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
rmp-serde = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
png = { workspace = true }
tokio-tungstenite = { workspace = true }
