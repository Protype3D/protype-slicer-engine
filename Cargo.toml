[workspace]
resolver = "2"
members = [
    "crates/slicer-daemon",
    "crates/slicer-rpc",
    "crates/slicer-state",
    "crates/slicer-pipeline",
    "crates/slicer-ffi",
    "crates/slicer-types",
    "crates/slicer-geometry",
    "crates/slicer-machine",
    "crates/slicer-scad",
    "crates/slicer-gcode",
    "crates/slicer-monitor",
    "crates/slicer-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Protype <hello@protype.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/dinamicby/protype-slicer-engine"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
ulid = "1"
sha2 = "0.10"
parking_lot = "0.12"
rmp-serde = "1"
tokio-tungstenite = "0.21"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
libc = "0.2"
windows-sys = "0.61"
cxx = "1"
cxx-build = "1"
manifold-rust = { version = "0.10", features = ["parallel"] }
base64 = "0.22"
png = "0.17"
